server.port=${SERVER_PORT_AUTH:8081}

spring.datasource.url=${DB_URL_AUTH}
spring.datasource.username=${DB_USERNAME_AUTH}
spring.datasource.password=${DB_PASSWORD_AUTH}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET_AUTH}
jwt.expiration-ms=${JWT_EXPIRATION_MS_AUTH:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS_AUTH:604800000}

logging.level.org.springframework.security=DEBUG
